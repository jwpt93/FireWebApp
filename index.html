<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grass fire spread — Cheney 1993</title>
<!--
  Redirect stub for GitHub Pages.

  The applet lives in web/ so that directory stays self-contained and
  deployable on its own -- nothing it loads escapes its own root. GitHub Pages
  serves from the repository root, so without this file the Pages URL would
  land on a directory listing rather than the applet.

  The target is relative, so this works unchanged at a user site, a project
  site under /FireWebApp/, or a local `python3 -m http.server`.
-->
<link rel="canonical" href="./web/">
<meta http-equiv="refresh" content="0; url=./web/">
<style>
  body {
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f4f4f1; color: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) { body { background: #121211; color: #fff; } }
  a { color: #2a78d6; }
  @media (prefers-color-scheme: dark) { a { color: #3987e5; } }
</style>
</head>
<body>
  <p>Redirecting to the <a href="./web/">grass fire spread applet</a>…</p>
  <script>location.replace('./web/');</script>
</body>
</html>
