[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheney-web"
version = "0.1.0"
description = "Cheney grass-fire spread models (empirical / 1D / 3D) — vendored subset of unitiedmodel2, packaged as a standalone compute layer for a website applet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [{ name = "jw", email = "jwpt93@gmail.com" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",   # animations
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["model*", "model_outdoor*"]
